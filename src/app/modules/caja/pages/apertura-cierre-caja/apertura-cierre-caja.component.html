<div class="container">
  <div class="row">
    <div class="col-12 col-sm-6">
      @if(cajaUsuario()){
      <info-caja-usuario [inCajaUsuario]=cajaUsuario()! />
      }
    </div>
    <div class="col-12 col-sm-6">
      <ul class="list-group my-2">
        <li class="list-group-item active d-flex justify-content-between">
          <span>Apertura o cierre de caja</span>
        </li>
      </ul>
      <form [formGroup]="formCaja">
        <mat-form-field *ngIf="!cajaActiva()" class="example-full-width">
          <mat-label>Caja por asignar</mat-label>
          <mat-select name="cajaId" formControlName="cajaId" (selectionChange)="seleccionarCaja($event.value)">
            <mat-option *ngFor="let caja of cajasPorAsignarResource.value()" [value]="caja.id">
              {{caja.nombre}} - {{caja.responsable}}
            </mat-option>
          </mat-select>
        </mat-form-field>
        <mat-form-field *ngIf="cajaActiva()" class="mr-2">
          <mat-label>En caja hay(conteo):</mat-label>
          <input matInput formControlName="saldoPorConteo" type="number" name="saldoPorConteo">
          <div *ngIf="formCaja.get('saldoPorConteo')?.invalid &&
                  (formCaja.get('saldoPorConteo')?.dirty ||
                  formCaja.get('saldoPorConteo')?.touched)">
            <mat-error *ngIf="formCaja.get('saldoPorConteo')?.errors?.['required']">
              Saldo caja es requerido
            </mat-error>
          </div>
        </mat-form-field>
        <div class="d-flex justify-content-around">
          <launcher-sfs [inPathFacturador]="caja().pathFacturador" [inDisabledBtn]="!cajaActiva()"></launcher-sfs>

          @if(authService.hasRole('ROLE_CLOSE_CJU')) {
          @if(cajaActiva()){
          <button type="button" class="btn btn-secondary" (click)="cerrarCaja()" [disabled] = "isFacturadorActive()" >Cerrar CAJA</button>
          }
          @if(!cajaActiva()){
          <button type="button" class="btn btn-secondary" (click)="abrirCaja()"
          [disabled]=!formCaja.valid>Abrir CAJA</button>
          }

          }
        </div>
      </form>
    </div>
  </div>
</div>
