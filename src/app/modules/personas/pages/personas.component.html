<div class="container">
  <div class="card">
    <div class="card-header">
      <h6 class="card-title">Listado de personas y proveedores</h6>
      <div class="ms-auto">
        <button *ngIf="authService.hasRole('ROLE_REGISTER_PERSONA')" color="primary" mat-raised-button
          [routerLink]="['form']">
          Crear persona
        </button>
      </div>
    </div>
    <div class="card-body">
      <!--       @if (loading()) {
      <mat-spinner></mat-spinner>
      } -->
      @if (authService.hasRole('ROLE_SEARCH_PERSONA')) {
      <search-box-table (searchEvent)="searchEvent($event)"></search-box-table>
      }
      <table mat-table [dataSource]="personas()" matSort (matSortChange)="sortChanged($event)"
        [matSortActive]="params().active" [matSortDirection]="params().direction" matSortDisableClear>

        <ng-container matColumnDef="id">
          <th mat-header-cell *matHeaderCellDef mat-sort-header> Id </th>
          <td mat-cell *matCellDef="let element"> {{element.id}} </td>
        </ng-container>

        <ng-container matColumnDef="apellNomRznSocial">
          <th mat-header-cell *matHeaderCellDef mat-sort-header> Persona o Proveedor </th>
          <td mat-cell *matCellDef="let element"> {{element.apellNomRznSocial}} </td>
        </ng-container>

        <!--           <ng-container matColumnDef="createAt">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> Fecha creacion </th>
            <td mat-cell *matCellDef="let element"> {{element.createAt | date: 'dd/MM/yyyy HH:mm:ss' }} </td>
          </ng-container> -->

        <ng-container matColumnDef="numeroDocumento">
          <th mat-header-cell *matHeaderCellDef> Documento </th>
          <td mat-cell *matCellDef="let element"> {{element.numeroDocumento}} </td>
        </ng-container>

        <ng-container matColumnDef="celular">
          <th mat-header-cell *matHeaderCellDef> Celular </th>
          <td mat-cell *matCellDef="let element"> {{element.celular}} </td>
        </ng-container>

        <!--           <ng-container matColumnDef="tipoPersona">
            <th mat-header-cell *matHeaderCellDef> Tipo Persona </th>
            <td mat-cell *matCellDef="let element"> {{element.tipoPersona.persona }} </td>
          </ng-container> -->

        <ng-container matColumnDef="acciones">
          <th mat-header-cell *matHeaderCellDef> Acciones </th>
          <td mat-cell *matCellDef="let element">
            <div class="d-flex flex-row">
              <button *ngIf="authService.hasRole('ROLE_UPDATE_PERSONA')" mat-icon-button color="primary"
                [routerLink]="['form', element.id]" matTooltip="Actualizar persona">
                <mat-icon>person_text</mat-icon>
              </button>

              <button *ngIf="authService.hasRole('ROLE_DELETE_PERSONA')" mat-icon-button color="warn"
                aria-label="Eliminar" (click)='delete(element)' matTooltip="Elimnar persona">
                <mat-icon>person_off</mat-icon>
              </button>
              <button mat-icon-button color="primary" *ngIf="authService.hasRole('ROLE_CREATE_COMPRA')"
                [routerLink]="['/pedidos/item-producto-proveedor-tienda', element.id]" matTooltip="Compra proveedor">
                <mat-icon>dashboard_customize</mat-icon>
              </button>
              <!--                 <button mat-icon-button color="primary" *ngIf="authService.hasRole('ROLE_REGISTER_VENTA')"
                  [routerLink]="['/pedidos/item-producto-persona-tienda', element.id]" matTooltip="Venta a cliente">
                  <mat-icon>shopping_cart</mat-icon>
                </button> -->
            </div>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        <tr class="mat-row" *matNoDataRow>
          <td class="mat-cell" colspan="5">No hay registros que mostrar</td>
        </tr>
      </table>
      <mat-paginator [length]="page()?.totalElements ?? 0" [pageIndex]="page()?.number ?? 0"
        [pageSizeOptions]="[10, 20, 50]" [pageSize]="page()?.size ?? 10" (page)="pageChanged($event)"
        showFirstLastButtons [ngClass]="{'d-none': personas().length===0}" class="table-paginator">
      </mat-paginator>

    </div>
  </div>
</div>
