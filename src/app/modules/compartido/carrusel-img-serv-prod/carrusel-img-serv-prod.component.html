@if(hasMultimediaProducto()){
<p-carousel autoplayInterval="8000" [value]="productos()" [numVisible]="4" [numScroll]="1"
  [circular]="inCircular()" [showNavigators]="inShowNavigators()" [showIndicators]="inShowIndicators()"
  orientation="horizontal" [responsiveOptions]="responsiveOptions">
  <ng-template let-producto #item>
    @if (producto){
    <div class="rounded item-carousel m-1 p-2">
      <div class="relative mx-auto mb-4">
        <a class="{{producto.estadoProducto.color}}"
          [routerLink]="['/tienda/productos-categoria',producto.categoria.nombre, 'item-producto-persona-online', producto.codigo]">
          <img [src]="API_URL_VER_IMAGEN+producto.multimediasAsignada[0].multimedia.nombre" [alt]="producto.multimediasAsignada[0].multimedia.descripcion"
            class="imagen" />
        </a>
      </div>
      <div class="mb-4 font-medium text-center">{{ producto.nombre | stringToTitleWithAccents }}</div>
      <div class="flex justify-content-between items-center">
        <div class="font-semibold text-xl">
          {{ producto.precioMasBajoProductoShow | currency: 'PEN' }}
        </div>
        <div>
          <a class="btn btn-secondary icon-square mb-2"
            [routerLink]="['/tienda/productos-categoria',producto.categoria.nombre, 'item-producto-persona-online', producto.codigo]">
            <i class="fa fa-eye"></i>
          </a>
        </div>
      </div>

    </div>
    }
  </ng-template>
</p-carousel>
}
