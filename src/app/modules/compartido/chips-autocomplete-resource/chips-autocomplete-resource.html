<mat-form-field>
  <mat-chip-grid #chipGrid>
    @for(item of chipsInArray(); track getKey()(item)) {
      <mat-chip-row (removed)="removeChip(item)">
    {{ displayWith()(item) }}
          <button matChipRemove>
            <mat-icon>cancel</mat-icon>
          </button>
      </mat-chip-row>
    }
  </mat-chip-grid>
  <mat-icon matPrefix>search</mat-icon>
  <input
     #chipInput
     matInput
    [placeholder]="placeholder()"
    [formControl]="control"
    [matAutocomplete]="auto"
    [matChipInputFor]="chipGrid" />
    @if(control.value) {
    <button matSuffix mat-icon-button type="button" (click)="clear()">
      <mat-icon>close</mat-icon>
    </button>
    }
  <mat-autocomplete
    #auto="matAutocomplete"
    (optionSelected)="seleccionar($event)">
    @for(item of resultados(); track item) {
      <mat-option [value]="item">
        {{ displayWith()(item) }}
      </mat-option>
    }
  </mat-autocomplete>
</mat-form-field>
