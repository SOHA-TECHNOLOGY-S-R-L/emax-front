<button type="button" [class]="buttonColor()" [disabled]="disabledButton()" (click)="ejecutarAccion()">
  @if (loading()) {
  <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true">
  </span>
  } @else {
  <i [class]="buttonIcon()"></i>
  }
  {{ buttonText() }}
</button>
