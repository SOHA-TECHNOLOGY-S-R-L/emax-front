<div class="container">

  <mat-card class="card">
    <form [formGroup]="formVenta" (ngSubmit)="generarReporte()">
      <mat-card-header class="card-header">
        <mat-card-title>{{titulo}}</mat-card-title>
        <div class="ms-auto">
          <button type="submit" mat-fab extended color="primary" class="">
            Descargar reporte
            <mat-icon>download</mat-icon>
          </button>
        </div>
      </mat-card-header>
      <mat-card-content class="d-flex flex-column">
        <mat-form-field>
          <mat-label>Desde</mat-label>
          <input matInput [matDatepicker]="fchDesde" formControlName="fchDesde">
          <mat-datepicker-toggle matIconSuffix [for]="fchDesde"></mat-datepicker-toggle>
          <mat-datepicker #fchDesde></mat-datepicker>
        </mat-form-field>
        <mat-form-field>
          <mat-label>Hasta</mat-label>
          <input matInput [matDatepicker]="fchHasta" formControlName="fchHasta">
          <mat-datepicker-toggle matIconSuffix [for]="fchHasta"></mat-datepicker-toggle>
          <mat-datepicker #fchHasta></mat-datepicker>
        </mat-form-field>
        <autocomplete-resource [placeholder]="'Buscar cliente'" [searchFn]="buscarPersonas"
          [displayWith]="mostrarPersona" (selected)="personSelecToInForm($event)">
          <ng-template let-persona>
            <div>
              {{ persona.nomApellRz }}
              <span class="text-bold-italic">Documento:</span> {{ persona.numeroDocumento }}
              <span class="text-bold-italic">Celular:</span> {{ persona.celular }}
            </div>
          </ng-template>
        </autocomplete-resource>
      </mat-card-content>
    </form>
  </mat-card>
</div>
